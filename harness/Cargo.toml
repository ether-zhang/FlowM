[package]
name = "flowm-harness"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
resolver = "2"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
codex-core-api = { path = "../third_party/codex/codex-rs/core-api" }
codex-core = { path = "../third_party/codex/codex-rs/core" }
codex-config = { path = "../third_party/codex/codex-rs/config" }
codex-extension-api = { path = "../third_party/codex/codex-rs/ext/extension-api" }
codex-history = { path = "../third_party/codex/codex-rs/history" }
codex-login = { path = "../third_party/codex/codex-rs/login" }
codex-model-provider-info = { path = "../third_party/codex/codex-rs/model-provider-info" }
codex-protocol = { path = "../third_party/codex/codex-rs/protocol" }
codex-rollout = { path = "../third_party/codex/codex-rs/rollout" }
dirs = "6"
http = "1"
jsonwebtoken = "9.3.1"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.9.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webbrowser = "1.2.4"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service"] }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "efa177859fd9623d57b9fe7ae9bf491ae1ac6ec4" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
