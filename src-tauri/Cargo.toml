[package]
name = "flowm"
version = "0.0.0"
description = "FlowM desktop shell"
edition = "2021"

# The library target lets Tauri's mobile/desktop codegen share one entry point.
[lib]
name = "flowm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native folder picker for "选择文件夹" — must run on the OS main thread (which the plugin
# handles); we call it from a Rust command so no JS plugin package / capability is needed.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Supervise FlowM's packaged runtime and its bounded input/output queues.
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
